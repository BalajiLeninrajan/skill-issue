<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skill Issue - Pre-register Your Rejection</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/BalajiLeninrajan/catppuccin-neu@v0.4.0/css/index.css">
  <style>
    /* The heading on the left, the form on the right. One column below 900px.
       Top-anchored so the heading holds still when the form collapses to one
       button on confirm. */
    .si-page {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 400px);
      column-gap: calc(var(--space-6) * 2);
      row-gap: var(--space-6);
      align-items: start;
      padding-block-start: calc(var(--space-6) * 3);
    }
    @media (max-width: 900px) {
      .si-page { grid-template-columns: minmax(0, 1fr); padding-block-start: 0; }
    }
  </style>
</head>
<body class="app-shell" data-state="form">
  <header class="topbar is-split">
    <span class="wordmark">Skill<em>&nbsp;Issue</em></span>
    <a class="btn btn-ghost is-sm" href="https://github.com/BalajiLeninrajan/skill-issue" target="_blank" rel="noopener">
      <svg viewBox="0 0 98 96" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" clip-rule="evenodd" d="M48.854 0C21.839 0 0 22 0 49.217c0 21.756 13.993 40.172 33.405 46.69 2.427.49 3.316-1.059 3.316-2.362 0-1.141-.08-5.052-.08-9.127-13.59 2.934-16.42-5.867-16.42-5.867-2.184-5.704-5.42-7.17-5.42-7.17-4.448-3.015.324-3.015.324-3.015 4.934.326 7.523 5.052 7.523 5.052 4.367 7.496 11.404 5.378 14.235 4.074.404-3.178 1.699-5.378 3.074-6.6-10.839-1.141-22.243-5.378-22.243-24.283 0-5.378 1.94-9.778 5.014-13.2-.485-1.222-2.184-6.275.486-13.038 0 0 4.125-1.304 13.426 5.052a46.97 46.97 0 0 1 12.214-1.63c4.125 0 8.33.571 12.213 1.63 9.302-6.356 13.427-5.052 13.427-5.052 2.67 6.763.97 11.816.485 13.038 3.155 3.422 5.015 7.822 5.015 13.2 0 18.905-11.404 23.06-22.324 24.283 1.78 1.548 3.316 4.481 3.316 9.126 0 6.6-.08 11.897-.08 13.526 0 1.304.89 2.853 3.316 2.364 19.412-6.52 33.405-24.935 33.405-46.691C97.707 22 75.788 0 48.854 0z"/></svg>
      GitHub
    </a>
  </header>

  <main class="page-main page-enter si-page" style="--page-width: 1040px">
    <header class="si-intro">
      <h1 class="cn-display is-sm" id="si-heading">Tell us where you <em>applied</em>. We send the <em>rejection</em>.</h1>
      <p class="cn-lede cn-mt-12 cn-mb-0" id="si-lede" aria-live="polite">It lands in your inbox within 48 hours, so you can stop refreshing.</p>
    </header>

    <form class="si-form cn-stack cn-gap-16" id="hope-form" novalidate>
      <div class="field">
        <label for="company">Company</label>
        <input type="text" id="company" name="company" required placeholder="TechCorp Inc." maxlength="200" autocomplete="organization">
      </div>
      <div class="field">
        <label for="job-title">Job title</label>
        <input type="text" id="job-title" name="jobTitle" required placeholder="Senior Software Engineer" maxlength="200" autocomplete="organization-title">
      </div>
      <div class="field">
        <label for="email">Your email</label>
        <input type="email" id="email" name="email" required placeholder="hopeful@example.com" maxlength="254" autocomplete="email" aria-describedby="email-help">
        <small id="email-help">The rejection goes here. Nothing else does.</small>
      </div>
      <div class="cn-row cn-mt-8">
        <button type="submit" class="btn btn-primary" id="submit-btn">I have hope</button>
      </div>
    </form>

    <div class="si-form cn-row cn-hidden" id="again">
      <button type="button" class="btn btn-secondary" id="reset-btn">Register more hope</button>
    </div>

  </main>

  <footer class="page-footer" style="--page-width: 1040px">
    <p>A therapeutic service for job seekers who prefer to skip the wait for rejection.</p>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
