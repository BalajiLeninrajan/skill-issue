<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skill Issue - Pre-register Your Rejection</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/BalajiLeninrajan/catppuccin-neu@v0.4.0/css/index.css">
</head>
<body class="app-shell" style="--page-width: 480px">
  <main class="page-main page-enter">
    <header class="cn-mb-32">
      <h1 class="cn-display is-sm cn-mb-12">Skill <em>Issue</em></h1>
      <p class="cn-lede cn-mb-0">It’s not the job market. It’s you.</p>
    </header>

    <div id="form-container">
      <form id="hope-form" class="cn-stack cn-gap-16">
        <div class="field">
          <label for="company">Company</label>
          <input type="text" id="company" name="company" required placeholder="TechCorp Inc." maxlength="200" autocomplete="organization">
        </div>

        <div class="field">
          <label for="job-title">Job title</label>
          <input type="text" id="job-title" name="jobTitle" required placeholder="Senior Software Engineer" maxlength="200" autocomplete="organization-title">
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required placeholder="hopeful@example.com" maxlength="254" autocomplete="email">
        </div>

        <div class="cn-mt-16">
          <button type="submit" id="submit-btn" class="btn btn-primary">I Have Hope</button>
        </div>
      </form>
    </div>

    <div id="confirmation" class="cn-hidden">
      <h2 class="cn-title cn-mb-8">Hope registered. Disappointment scheduled.</h2>
      <p class="cn-copy cn-mb-0">Your rejection arrives by email within 48 hours. Check spam.</p>
      <button id="reset-btn" class="btn btn-secondary cn-raised-soft cn-pressable cn-mt-24">Register More Hope</button>
    </div>
  </main>

  <footer class="page-footer">
    <p>A therapeutic service for job seekers who prefer to skip the wait for rejection.</p>

  </footer>

  <script src="/app.js"></script>
</body>
</html>
